name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: 5. Verify & Accept Any Additional SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 6. Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: 7. Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 8. Build Vite Web App
        run: |
          npm run build
          # Remove any archive files from dist to keep the APK compact
          rm -rf dist/assets/aistudio/*.zip dist/*.zip 2>/dev/null || true

      - name: 9. Prepare and Sync Capacitor Android
        run: |
          npx cap telemetry off || true
          # Configure local.properties to point to the runner's Android SDK
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # Remove any stale zip files before sync
          rm -rf android/app/src/main/assets/public/assets/aistudio/*.zip 2>/dev/null || true
          npx cap sync android

      - name: 10. Prepare Android Build Environment
        run: |
          # 1. Normalize line endings and execution permissions for Gradle wrapper
          if [ -f "android/gradlew" ]; then
            sed -i -e 's/\r$//' android/gradlew
            chmod +x android/gradlew
          fi

          # 2. Ensure gradle-wrapper.jar exists
          mkdir -p android/gradle/wrapper
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar || true
          fi

          # 3. Ensure capacitor-cordova-android-plugins directory structure exists
          mkdir -p android/capacitor-cordova-android-plugins/src/main/libs

      - name: 11. Compile & Build Android Debug APK
        run: |
          cd android
          if [ -x "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Building APK using ./gradlew assembleDebug..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Building APK using system Gradle assembleDebug..."
            gradle assembleDebug --no-daemon --stacktrace
          fi
          cd ..

      - name: 12. Locate Generated APK
        id: locate_apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find android/ -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file was found in Android build output directory!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" AyByay-ExpenseTracker-debug.apk
          ls -lh AyByay-ExpenseTracker-debug.apk
          echo "apk_path=AyByay-ExpenseTracker-debug.apk" >> $GITHUB_ENV

      - name: 13. Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AyByay-ExpenseTracker-APK
          path: ${{ env.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: 14. Create GitHub Release (Optional on Manual Run or Tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ay Byay App v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: ${{ env.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
